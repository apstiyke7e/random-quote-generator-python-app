<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f1e8">
    <title>A Little Perspective</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="page-shell">
      <header class="topline">
        <a class="wordmark" href="/" aria-label="A Little Perspective home">
          <span class="mark" aria-hidden="true">✳</span>
          <span>A LITTLE PERSPECTIVE</span>
        </a>
        <span class="edition">A DAILY PAUSE <span aria-hidden="true">/</span> NO. 01</span>
      </header>

      <section class="quote-layout" aria-labelledby="page-title">
        <div class="side-note">
          <span class="side-line" aria-hidden="true"></span>
          <span>WORDS TO CARRY WITH YOU</span>
        </div>

        <div class="quote-content">
          <p class="eyebrow" id="page-title">A moment for today</p>
          <blockquote>
            <span class="quote-mark" aria-hidden="true">“</span>
            <p>{{ quote.text }}</p>
          </blockquote>
          <p class="attribution"><span aria-hidden="true"></span>{{ quote.author }}</p>
          <a class="next-quote" href="{{ url_for('home') }}">
            <span>Another thought</span>
            <span class="arrow" aria-hidden="true">&#8594;</span>
          </a>
        </div>

        <div class="page-index" aria-hidden="true">01 <span></span> 07</div>
      </section>

      <footer class="footer-line">
        <span>TAKE WHAT YOU NEED. LEAVE THE REST.</span>
        <span class="footer-symbol" aria-hidden="true">&#10022;</span>
        <span>REFRESH FOR A NEW PERSPECTIVE</span>
      </footer>
    </main>
  </body>
</html>
